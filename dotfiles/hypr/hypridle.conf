# Upstream: https://github.com/hyprwm/hypridle/releases/tag/v0.1.8
general {
    lock_cmd = bash ~/.config/hypr/hyprlock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    # Wait for the Wayland session-lock event, not merely the lock command spawning.
    inhibit_sleep = 3
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
}

# Automatic idle actions only run when a system battery is discharging.
# Keep the daemon on AC for manual lock requests and lock-before-suspend.
listener {
    timeout = 300 # 5 minutes: lock (battery only)
    on-timeout = bash ~/.config/hypr/hypridle-battery.sh lock
}

listener {
    timeout = 500 # 8 minutes 20 seconds: screens off (battery only; no suspend)
    on-timeout = bash ~/.config/hypr/hypridle-battery.sh screens-off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
