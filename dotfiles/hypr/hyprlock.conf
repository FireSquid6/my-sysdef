# Tokyo Night Night. Empty monitor selectors show the lock UI on every output.
# Upstream: https://github.com/hyprwm/hyprlock/releases/tag/v0.9.7
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    immediate_render = true
}

auth {
    pam {
        enabled = true
        module = hyprlock
    }
}

# Opaque from the first frame; never expose the desktop during lock/wake.
animations {
    enabled = false
}

background {
    monitor =
    path =
    color = rgb(1a1b26)
}

label {
    monitor =
    text = $TIME
    color = rgb(c0caf5)
    font_size = 80
    font_family = $font
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(a9b1d6)
    font_size = 20
    font_family = $font
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 60
    outline_thickness = 2
    rounding = 10
    outer_color = rgb(bb9af7)
    inner_color = rgb(24283b)
    font_color = rgb(c0caf5)
    check_color = rgb(7aa2f7)
    fail_color = rgb(f7768e)
    capslock_color = rgb(e0af68)
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL
    check_text = Authenticating...
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(9aa5ce)
    font_size = 16
    font_family = $font
    position = 0, -100
    halign = center
    valign = center
}
